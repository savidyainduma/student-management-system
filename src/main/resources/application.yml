spring:
  application:
    name: backend
  datasource:
    username: root
    url: jdbc:mysql://localhost:3306/student_management?useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true